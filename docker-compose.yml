services:
  oxidized:
    image: oxidized/oxidized:latest
    container_name: oxidized
    restart: unless-stopped

    environment:
      TZ: Asia/Jakarta

    ports:
      - "8888:8888"

    volumes:
      - ./oxidized-config:/home/oxidized/.config/oxidized

    networks:
      - network-backup


  node-manager:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oxidized-node-manager
    restart: unless-stopped

    depends_on:
      - oxidized

    environment:
      TZ: Asia/Jakarta
      FLASK_ENV: production

      # Secrets come from the untracked .env file (see .env.template);
      # defaults only keep fresh clones bootable, change them in production.
      OXIDIZED_API_URL: http://oxidized:8888
      OXIDIZED_USER: ${OXIDIZED_USER:-admin}
      OXIDIZED_PASSWORD: ${OXIDIZED_PASSWORD:-admin}
      # Fail fast with a clear message instead of passing an empty string
      # into the container (an empty SECRET_KEY breaks Flask sessions).
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env - generate one with: openssl rand -hex 32}

      DATABASE_PATH: /oxidized_config/nodes.db
      CONFIG_FILE: /oxidized_config/nodes.csv

    ports:
      - "8080:5000"

    volumes:
      - ./oxidized-config:/oxidized_config
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - network-backup


networks:
  network-backup:
    driver: bridge
