name: Deploy to Backup Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/oxidized-node-manager

            echo "Updating source code..."
            git fetch project
            git reset --hard project/master

            echo "Rebuilding Node Manager..."
            docker compose build node-manager

            echo "Restarting Node Manager..."
            docker compose up -d node-manager

            echo "Checking containers..."
            docker compose ps
