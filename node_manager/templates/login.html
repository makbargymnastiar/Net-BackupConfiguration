<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Login - Oxidized Node Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <!-- Decorative network-device backdrop: routers, switches, servers and
         links drawn as light line art over the gradient, so the page no
         longer reads as a flat blue screen. Pure inline SVG — no assets. -->
    <svg class="login-bg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <g class="bg-links" fill="none" stroke-linecap="round" stroke-dasharray="5 11">
            <polyline points="170,200 480,290 720,150 1200,290 1380,180" />
            <polyline points="200,470 330,720 760,570 1010,790 1230,680" />
            <polyline points="1440,470 1200,290" />
            <polyline points="720,150 760,570" />
            <polyline points="1380,180 1440,470 1230,680" />
            <g class="bg-link-dots" stroke="none">
                <circle cx="170" cy="200" r="4" />
                <circle cx="480" cy="290" r="4" />
                <circle cx="720" cy="150" r="4" />
                <circle cx="1200" cy="290" r="4" />
                <circle cx="1380" cy="180" r="4" />
                <circle cx="330" cy="720" r="4" />
                <circle cx="760" cy="570" r="4" />
                <circle cx="1010" cy="790" r="4" />
                <circle cx="1230" cy="680" r="4" />
                <circle cx="1440" cy="470" r="4" />
            </g>
        </g>
        <g class="bg-devices" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <!-- router -->
            <g transform="translate(120,150) scale(3.2) rotate(-5)">
                <rect x="2" y="13" width="20" height="7" rx="2" />
                <line x1="6" y1="13" x2="6" y2="7" />
                <line x1="18" y1="13" x2="18" y2="7" />
                <circle cx="6" cy="5.5" r="1.5" />
                <circle cx="18" cy="5.5" r="1.5" />
                <circle cx="6" cy="16.5" r="0.7" />
                <circle cx="9" cy="16.5" r="0.7" />
            </g>
            <!-- server rack -->
            <g transform="translate(1320,100) scale(3.4)">
                <rect x="4" y="2" width="16" height="6" rx="1" />
                <rect x="4" y="10" width="16" height="6" rx="1" />
                <rect x="4" y="18" width="16" height="4" rx="1" />
                <circle cx="7" cy="5" r="0.7" />
                <circle cx="7" cy="13" r="0.7" />
                <line x1="11" y1="5" x2="17" y2="5" />
                <line x1="11" y1="13" x2="17" y2="13" />
            </g>
            <!-- switch -->
            <g transform="translate(240,670) scale(3) rotate(3)">
                <rect x="1" y="9" width="22" height="6" rx="1.5" />
                <rect x="3.5" y="11" width="2" height="2" />
                <rect x="7" y="11" width="2" height="2" />
                <rect x="10.5" y="11" width="2" height="2" />
                <rect x="14" y="11" width="2" height="2" />
                <rect x="17.5" y="11" width="2" height="2" />
            </g>
            <!-- cloud -->
            <g transform="translate(650,80) scale(3.2)">
                <path d="M6.5 17.5h11a4 4 0 0 0 .8-7.9 6 6 0 0 0-11.6-1.4A4.5 4.5 0 0 0 6.5 17.5z" />
            </g>
            <!-- wifi access point -->
            <g transform="translate(1170,630) scale(3)">
                <circle cx="12" cy="18" r="2" />
                <path d="M7.5 13.5a6.4 6.4 0 0 1 9 0" />
                <path d="M4.5 10a10.6 10.6 0 0 1 15 0" />
            </g>
            <!-- laptop -->
            <g transform="translate(80,410) scale(2.6) rotate(-4)">
                <rect x="4.5" y="5" width="15" height="9.5" rx="1" />
                <line x1="2.5" y1="19" x2="21.5" y2="19" />
            </g>
            <!-- database -->
            <g transform="translate(1400,410) scale(2.8)">
                <ellipse cx="12" cy="6" rx="7" ry="3" />
                <path d="M5 6v12a7 3 0 0 0 14 0V6" />
                <path d="M5 12a7 3 0 0 0 14 0" />
            </g>
            <!-- firewall -->
            <g transform="translate(940,730) scale(2.6)">
                <rect x="3" y="7" width="18" height="10" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="8" y1="7" x2="8" y2="12" />
                <line x1="16" y1="7" x2="16" y2="12" />
                <line x1="12" y1="12" x2="12" y2="17" />
                <line x1="20" y1="12" x2="20" y2="17" />
            </g>
            <!-- monitor / NOC screen -->
            <g transform="translate(420,230) scale(2.2) rotate(4)">
                <rect x="3" y="4" width="18" height="12" rx="2" />
                <line x1="12" y1="16" x2="12" y2="20" />
                <line x1="8" y1="20" x2="16" y2="20" />
            </g>
            <!-- router (small, tilted) -->
            <g transform="translate(1150,220) scale(2.4) rotate(8)">
                <rect x="2" y="13" width="20" height="7" rx="2" />
                <line x1="6" y1="13" x2="6" y2="7" />
                <line x1="18" y1="13" x2="18" y2="7" />
                <circle cx="6" cy="5.5" r="1.5" />
                <circle cx="18" cy="5.5" r="1.5" />
            </g>
            <!-- switch (small) -->
            <g transform="translate(690,510) scale(2.2) rotate(-6)">
                <rect x="1" y="9" width="22" height="6" rx="1.5" />
                <rect x="3.5" y="11" width="2" height="2" />
                <rect x="7" y="11" width="2" height="2" />
                <rect x="10.5" y="11" width="2" height="2" />
                <rect x="14" y="11" width="2" height="2" />
            </g>
            <!-- server rack (small) -->
            <g transform="translate(540,750) scale(2.4)">
                <rect x="4" y="2" width="16" height="6" rx="1" />
                <rect x="4" y="10" width="16" height="6" rx="1" />
                <circle cx="7" cy="5" r="0.7" />
                <line x1="11" y1="13" x2="17" y2="13" />
            </g>
            <!-- cloud (small) -->
            <g transform="translate(130,50) scale(2.2)">
                <path d="M6.5 17.5h11a4 4 0 0 0 .8-7.9 6 6 0 0 0-11.6-1.4A4.5 4.5 0 0 0 6.5 17.5z" />
            </g>
        </g>
    </svg>

    <div class="login-container">
        <h1 id="login-title">Login</h1>
        <p id="login-subtitle">Oxidized Node Management System</p>

        <div id="alert" class="alert"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="username-label">Username</label>
                <input type="text" id="username" required autofocus>
            </div>
            <div class="form-group">
                <label id="password-label">Password</label>
                <div class="password-input-group">
                    <input type="password" id="password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <button type="submit" class="btn" id="login-btn">Login</button>
        </form>
    </div>

    <script>
        // Eye / eye-off SVG icons (same shapes the dashboard uses) instead of
        // the 👁️ emoji, which rendered inconsistently.
        const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const evt = window.event;
            const button = evt && evt.target ? evt.target.closest('.password-toggle') : null;
            if (!input || !button) return;

            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = EYE_OFF;
                button.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                button.innerHTML = EYE_OPEN;
                button.setAttribute('aria-label', 'Show password');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    if (data.must_change_password) {
                        window.location.href = '/force-change-password';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    const alert = document.getElementById('alert');
                    alert.textContent = 'Invalid username or password';
                    alert.classList.add('error');
                    alert.style.display = 'block';
                }
            });
        }
    </script>
</body>
</html>
