<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Change Password - First Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/force_change_password.css') }}">
</head>
<body>
    <div class="container">
        <h1 id="title">Change Password</h1>
        <p id="subtitle">This is your first login. For security reasons, you must change your password.</p>
        <div class="warning" id="warning">You cannot proceed to the system until you change your password.</div>
        
        <div id="alert" class="alert"></div>
        
        <form onsubmit="handleChangePassword(event)">
            <div class="form-group">
                <label id="label-current">Current Password</label>
                <div class="password-input-group">
                    <input type="password" id="currentPassword" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('currentPassword')" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="form-group">
                <label id="label-new">New Password</label>
                <div class="password-input-group">
                    <input type="password" id="newPassword" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('newPassword')" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <div class="form-group">
                <label id="label-confirm">Confirm New Password</label>
                <div class="password-input-group">
                    <input type="password" id="confirmPassword" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('confirmPassword')" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                </div>
            </div>
            <button type="submit" class="btn" id="btn-change">Change Password</button>
        </form>
    </div>

    <script>
        // Eye / eye-off SVG toggle — same implementation as the login page.
        // The buttons used to call togglePasswordVisibility(), but the
        // function was never defined here, so clicks did nothing.
        const EYE_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
        const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10 10 0 0 1 12 20C5 20 1 12 1 12a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c7 0 11 8 11 8a18 18 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const evt = window.event;
            const button = evt && evt.target ? evt.target.closest('.password-toggle') : null;
            if (!input || !button) return;

            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = EYE_OFF;
                button.setAttribute('aria-label', 'Hide password');
            } else {
                input.type = 'password';
                button.innerHTML = EYE_OPEN;
                button.setAttribute('aria-label', 'Show password');
            }
        }

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
        }

        function handleChangePassword(e) {
            e.preventDefault();
            const current = document.getElementById('currentPassword').value;
            const newPass = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (newPass.length < 6) {
                showAlert('Password must be at least 6 characters');
                return;
            }

            if (newPass !== confirm) {
                showAlert('Passwords do not match');
                return;
            }

            if (newPass === current) {
                showAlert('New password cannot be the same as current password');
                return;
            }

            fetch('/api/force-change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    current_password: current,
                    new_password: newPass
                })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showAlert('Password changed successfully, redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showAlert(data.error || 'Current password is incorrect');
                }
            });
        }
    </script>
</body>
</html>
